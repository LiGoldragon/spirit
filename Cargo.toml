[package]
name         = "spirit"
version      = "0.24.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/spirit"
description  = "Runnable schema-derived Spirit pilot: NOTA CLI, rkyv socket, generated schema types."
publish      = false

[lib]
name = "spirit"
path = "src/lib.rs"

[[bin]]
name = "spirit"
path = "src/bin/spirit.rs"
required-features = ["nota-text"]

[[bin]]
name = "meta-spirit"
path = "src/bin/meta-spirit.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-daemon"
path = "src/bin/spirit-daemon.rs"

[[bin]]
name = "spirit-write-configuration"
path = "src/bin/spirit-write-configuration.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-render"
path = "src/bin/spirit-render.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-migrate-store"
path = "src/bin/spirit-migrate-store.rs"
required-features = ["production-migration"]

[[test]]
name = "nix_integration"
path = "tests/nix_integration.rs"
required-features = ["nota-text"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
required-features = ["nota-text"]

[features]
default = []
nota-text = ["dep:nota", "nota-text-query/nota-text", "signal-domain/nota-text", "signal-spirit/nota-text", "meta-signal-spirit/nota-text", "signal-introspect?/nota-text"]
agent-guardian = ["nota-text", "dep:signal-agent"]
production-migration = ["nota-text", "dep:sema-engine-layout3", "dep:sema-engine-previous"]
testing-trace = ["dep:signal-introspect", "dep:signal-persona"]
# The LIVE criome acceptance gate (the everywhere-gate, Spirit `xhwa` as
# corrected 2026-07-07): the spirit-side `CriomeAuthorization` option keeps
# the intake gate dormant (`Disabled`, the operative default — spirit fully
# local, heads advance freely) or cluster-gated (`Enabled(authorizer)` —
# every head-advancing working input is STAGED, authorized by the local
# criome's cluster, and appended only on the grant; every other terminal
# verdict refuses the operation to the caller and discards the staged group,
# fail-closed, nothing recorded anywhere). criome brings the `CriomeClient`
# socket transport and observation session both authorizers consume;
# signal-criome brings the typed authorized-object reference and decision
# vocabulary the seam speaks. Acceptance gating is deliberately its OWN
# feature: it must never be compiled out together with shipping.
criome-gate = ["dep:criome", "dep:signal-criome"]
# The gated mirror shipper: ship the (by construction cluster-authorized)
# versioned log to a sema version-control mirror. OFF by default and
# deploy-gated. Pulls the `mirror` crate (and its signal-mirror/nota
# transitive surface), so it is excluded from the binary-only daemon
# dependency tree unless explicitly enabled. Shipping is pure distribution
# of accepted state; the acceptance gate itself lives under `criome-gate`.
mirror-shipper = ["criome-gate", "dep:mirror", "dep:signal-mirror"]
# The OFFLINE full-chain e2e's router leg. Router fans the authorized typed
# object reference to subscribers. Gated as its own opt-in feature so the
# default `cargo test --features mirror-shipper` does not have to compile the
# `router` dev surface, whose source currently lags its own
# signal-router/signal-message contracts on main. Enable this only to
# build/run `end_to_end_offline_full_chain`.
offline-full-chain-e2e = ["mirror-shipper", "dep:router", "dep:signal-standard"]
# The cluster-authorization loopcheck's router leg (§3.7): two real criome
# hosts over two real routers on loopback TCP, a real spirit engine gated
# against criome A. Opt-in like the offline e2e so the default test build does
# not compile the router surface.
cluster-authorization-e2e = ["mirror-shipper", "dep:router", "dep:signal-router", "dep:meta-signal-router", "dep:meta-signal-criome"]

[[test]]
name = "instrumentation_logging"
path = "tests/instrumentation_logging.rs"
required-features = ["testing-trace"]

[[test]]
name = "mirror_shipper"
path = "tests/mirror_shipper.rs"
required-features = ["mirror-shipper"]

# The spirit-side criome authorization option witness: `Disabled` (the
# operative default) keeps heads advancing freely with the authorize-and-ship
# seam dormant (nothing propagates); `Enabled` carries the cluster authorizer
# and refuses head advances until the cluster grants.
[[test]]
name = "criome_authorization_option"
path = "tests/criome_authorization_option.rs"
required-features = ["mirror-shipper"]

# The everywhere-gate intake witnesses (§3.5/§3.8/§3.9): staged acceptance,
# typed refusal to the caller with no observable trace, byte-for-byte grant
# materialization against the Disabled twin, and crash-window recovery.
[[test]]
name = "staged_intake"
path = "tests/staged_intake.rs"
required-features = ["criome-gate"]

# The §3.2 session-parse matrix witnesses: the closed binding rules spirit
# applies to criome's authorization observation session, every negative held
# fail-closed, plus the crafted-daemon socket falsifications.
[[test]]
name = "cluster_gate_session"
path = "tests/cluster_gate_session.rs"
required-features = ["criome-gate"]

# The OFFLINE full-chain e2e: spirit source engine records → ships to mirror A
# → criome authorizes the shipped head → router fans the typed head reference
# → mirror latest restore is accepted or rejected by the delivered digest.
[[test]]
name = "end_to_end_offline_full_chain"
path = "tests/end_to_end_offline_full_chain.rs"
required-features = ["offline-full-chain-e2e"]

# THE CLUSTER-AUTHORIZATION LOOPCHECK (§3.7,
# spirit-cluster-authorizes-head-advance-over-router-test): a real spirit
# engine on node A gated against criome A; two real criome hosts found one
# root over two real routers on loopback TCP; batched authorized advance,
# refusal when the quorum cannot complete, catch-up retry after refusal.
[[test]]
name = "cluster_authorization_over_router"
path = "tests/cluster_authorization_over_router.rs"
required-features = ["cluster-authorization-e2e"]

[dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
blake3 = "1"
getrandom = "0.3"
# The reusable component-side mirror shipper. Gated entirely on an
# owner-configured meta MirrorTarget: with no target, no shipper ever starts.
# Gated behind the `mirror-shipper` feature (OFF by default). mirror pulls
# signal-mirror/meta-signal-mirror/nota unconditionally, so leaving it out
# of the default build keeps nota out of the binary-only daemon dependency
# tree — the daemon's no-NOTA invariant (INTENT). default-features = false drops
# mirror's own nota-text codec, which the shipper does not use.
mirror = { git = "https://github.com/LiGoldragon/mirror.git", branch = "main", default-features = false, optional = true }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
# The previous engine generation, used only by the production-migration
# bootstrap: it reads pre-versioning stores the current engine refuses to open.
sema-engine-previous = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "ebee6e44ba6ee4afcb26998007bcfd128641b54c", package = "sema-engine", optional = true }
# The deployed v9/layout-3 engine generation, used only by the
# production-migration bootstrap to read materialized rows from the live
# 0.12.1 store whose old versioned log cannot be decoded by the layout-5
# engine.
sema-engine-layout3 = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "dbe29427d9a2c6c194909385485ad42b008048b8", package = "sema-engine", optional = true }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-mirror = { git = "https://github.com/LiGoldragon/signal-mirror.git", branch = "main", default-features = false, optional = true }
# The criome seams (Spirit `xhwa`), gated behind `mirror-shipper`. criome
# brings the `CriomeClient` synchronous Unix-socket transport the guardian
# operation authorizer wraps in `spawn_blocking`; signal-criome brings the
# typed `AuthorizedObjectReference` the dormant head-authorization seam
# projects from the post-commit head plus its decision vocabulary. Both pin
# `branch=main`, so Cargo unifies their shared transitive crates
# (triad-runtime, sema-engine, nota, signal-frame) with the mirror leg in one
# binary. default-features = false on signal-criome drops its nota-text codec,
# which the daemon (binary rkyv only) does not use.
criome = { git = "https://github.com/LiGoldragon/criome.git", branch = "main", optional = true }
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "main", default-features = false, optional = true }
# The router leg of the OFFLINE full-chain e2e, behind the opt-in
# `offline-full-chain-e2e` feature (NOT the production gate path). Optional so
# the default test build does not compile router's currently-lagging source.
router = { git = "https://github.com/LiGoldragon/router.git", branch = "main", optional = true }
# The router wire contract plus the router/criome meta contracts the
# cluster-authorization loopcheck's harness speaks (working-socket fronting,
# the owner mirror switch, the founding accepts). Optional, pulled in only by
# `cluster-authorization-e2e`.
signal-router = { git = "https://github.com/LiGoldragon/signal-router.git", branch = "main", default-features = false, optional = true }
meta-signal-router = { git = "https://github.com/LiGoldragon/meta-signal-router.git", branch = "main", default-features = false, optional = true }
meta-signal-criome = { git = "https://github.com/LiGoldragon/meta-signal-criome.git", branch = "main", default-features = false, optional = true }
signal-standard = { git = "https://github.com/LiGoldragon/signal-standard.git", branch = "main", default-features = false, optional = true }
signal-agent = { git = "https://github.com/LiGoldragon/signal-agent.git", branch = "main", optional = true }
# The shared wire contract for the tracing -> introspect slice (report 716):
# spirit projects its own `TraceEvent` onto `signal_introspect::ComponentTraceEvent`
# and pushes that contract type over the testing-trace socket, so introspect
# decodes the exact archived noun without depending on spirit. default-features
# = false drops its nota-text codec from non-text builds; spirit's own nota-text
# feature re-enables it.
# The shared wire contract for the tracing -> introspect slice (report 716):
# spirit projects its own `TraceEvent` onto `signal_introspect::ComponentTraceEvent`
# and pushes that contract type over the testing-trace socket, so introspect
# decodes the exact archived noun without depending on spirit. Optional and
# pulled in ONLY by `testing-trace`: signal-introspect carries a non-optional
# nota dependency, so leaving it out of the default daemon build keeps
# nota out of the binary-only runtime tree (the daemon's no-NOTA invariant).
signal-introspect = { git = "https://github.com/LiGoldragon/signal-introspect.git", branch = "main", default-features = false, optional = true }
# The `EngineIdentifier` newtype stamped onto each pushed `ComponentTraceEvent`.
# It is a public field type of the `signal-introspect` contract records but is
# not re-exported from that crate's root, so spirit pins the same `signal-persona`
# instance directly to construct it; Cargo unifies it with signal-introspect's.
# Optional and pulled in only by `testing-trace`, for the same no-NOTA reason.
signal-persona = { git = "https://github.com/LiGoldragon/signal-persona.git", branch = "main", optional = true }
signal-domain = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "801e1c5bcc824c9760e246205826e3c8e962d005", default-features = false }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", rev = "1cf7c010029de46369b742687da4fa1ca6def9a9" }
meta-signal-spirit = { git = "https://github.com/LiGoldragon/meta-signal-spirit.git", rev = "0a7a2438c8e5d57cb1fd413452d0a7ddad4fb9b3" }
nota-text-query = { git = "https://github.com/LiGoldragon/nota-text-query.git", rev = "6140a3e9afe3f81c18a39cb0a11dec4eab68b561", default-features = false }
thiserror = "2"
tokio = { version = "1.47", features = ["io-util", "net", "rt-multi-thread", "sync"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "f3b4563163dd11ba1cbbcca8081701ab7830b8f5" }

[dev-dependencies]
agent = { git = "https://github.com/LiGoldragon/agent.git", branch = "main", features = ["live-provider"] }
# The mirror working/meta contracts, for the in-process mirror fixture the
# gated-shipper test ships to and restores from. Same branches mirror pins, so
# Cargo unifies them with the `mirror` crate's own dependency instances.
meta-signal-mirror = { git = "https://github.com/LiGoldragon/meta-signal-mirror.git", branch = "main" }
schema-language = { git = "https://github.com/LiGoldragon/schema-language.git", rev = "6aae825d668e3f607a2754afa6b7d94e9f246c41" }
# Typed `SemaOperation` labels for versioned-log shape witnesses.
signal-sema = { git = "https://github.com/LiGoldragon/signal-sema.git", branch = "main" }
tempfile = "3"

[[test]]
name = "guardian_live_scenarios"
path = "tests/guardian_live_scenarios.rs"
required-features = ["agent-guardian"]

[[test]]
name = "guardian_journal_upgrade"
path = "tests/guardian_journal_upgrade.rs"
required-features = ["agent-guardian"]

[patch."https://github.com/LiGoldragon/nota-next.git"]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }
nota-derive = { package = "nota-derive", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }

[patch."https://github.com/LiGoldragon/schema-next.git"]
schema = { package = "schema", git = "https://github.com/LiGoldragon/schema.git", rev = "92bed64ad644ce4caa2827398ada5b7b79221165" }
schema-cc = { package = "schema-cc", git = "https://github.com/LiGoldragon/schema.git", rev = "92bed64ad644ce4caa2827398ada5b7b79221165" }

# TRANSIENT TYPE-CHECK INSTRUMENTATION — never commit: a scratchpad copy of
# mirror with its schema names migrated, so the mirror-shipper-gated spirit
# surface can be type-checked despite the pre-existing mirror wedge.
[patch."https://github.com/LiGoldragon/mirror.git"]
mirror = { path = "/tmp/claude-1001/-home-li-primary/a2018f45-014c-45ef-9483-b9e5c9c0f086/scratchpad/mirror-typecheck" }

# TRANSIENT TYPE-CHECK INSTRUMENTATION — never commit: a scratchpad copy of
# meta-signal-router with its schema names migrated, so the e2e-gated spirit
# surface can be type-checked despite the same schema-validator wedge.
[patch."https://github.com/LiGoldragon/meta-signal-router.git"]
meta-signal-router = { path = "/tmp/claude-1001/-home-li-primary/a2018f45-014c-45ef-9483-b9e5c9c0f086/scratchpad/meta-signal-router-typecheck" }

[patch."https://github.com/LiGoldragon/schema-rust-next.git"]
# Pinned BEHIND spirit's own schema-rust build dependency: the crates that
# resolve through this patch (signal-criome and peers) authored their
# checked-in schema artifacts against this older validator and fail the
# newer schema-language freshness rules; they advance on their own schedule.
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "a4b46ffffe5307eca3e1537539d0a70884955b4c" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

