[package]
name         = "spirit-next"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/spirit-next"
description  = "Runnable schema-derived Spirit pilot: NOTA CLI, rkyv socket, generated schema types."
publish      = false

[lib]
name = "spirit_next"
path = "src/lib.rs"

[[bin]]
name = "spirit-next"
path = "src/bin/spirit-next.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-next-daemon"
path = "src/bin/spirit-next-daemon.rs"

[[test]]
name = "nix_integration"
path = "tests/nix_integration.rs"
required-features = ["nota-text"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
required-features = ["nota-text"]

[features]
default = []
nota-text = ["dep:nota-next"]
testing-trace = ["dep:triad-runtime"]

[[test]]
name = "instrumentation_logging"
path = "tests/instrumentation_logging.rs"
required-features = ["testing-trace"]

[dependencies]
nota-next = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb = "2.6.3"
blake3 = "1"
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main", optional = true }

[build-dependencies]
schema-next = { git = "https://github.com/LiGoldragon/schema-next.git", branch = "main" }
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
