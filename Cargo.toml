[package]
name         = "spirit"
version      = "0.21.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/spirit"
description  = "Runnable schema-derived Spirit pilot: NOTA CLI, rkyv socket, generated schema types."
publish      = false

[lib]
name = "spirit"
path = "src/lib.rs"

[[bin]]
name = "spirit"
path = "src/bin/spirit.rs"
required-features = ["nota-text"]

[[bin]]
name = "meta-spirit"
path = "src/bin/meta-spirit.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-daemon"
path = "src/bin/spirit-daemon.rs"

[[bin]]
name = "spirit-write-configuration"
path = "src/bin/spirit-write-configuration.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-render"
path = "src/bin/spirit-render.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-migrate-store"
path = "src/bin/spirit-migrate-store.rs"
required-features = ["production-migration"]

[[test]]
name = "nix_integration"
path = "tests/nix_integration.rs"
required-features = ["nota-text"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
required-features = ["nota-text"]

[features]
default = []
nota-text = ["dep:nota", "signal-spirit/nota-text", "meta-signal-spirit/nota-text", "signal-introspect?/nota-text"]
agent-guardian = ["nota-text", "dep:signal-agent"]
production-migration = ["nota-text", "dep:sema-engine-layout3", "dep:sema-engine-previous"]
testing-trace = ["dep:signal-introspect", "dep:signal-persona"]
# Spirit's router-mediated mirror participation (Spirit `xhwa`, piece 4 + the
# origination hand-off). OFF by default and deploy-gated. Two halves:
#   - ORIGINATION (async propose→completion quorum boundary, primary-nbmq.10):
#     after a working commit, Spirit PROPOSES the content-addressed head to its
#     LOCAL criome under the admitted mirror quorum contract; criome gathers the
#     peer's vote across the voice, and ONLY on the quorum's Authorized verdict
#     does Spirit hand {versioned entry + the quorum-assembled Evidence} to its
#     LOCAL router's working socket as one RoutedContractObject (signal-router
#     `SubmitRoutedObjects`). Withheld while Gathering — never last-writer-wins.
#   - APPLY INGRESS: a routed record arriving on the working socket is re-judged
#     by the LOCAL criome (fail-closed) and landed live via `import_record`.
# criome brings the `CriomeClient` socket transport; signal-criome brings the
# typed Evidence + EvaluateAuthorization; signal-router brings the origination
# submit op + `ForwardedMessagePayload` / `RoutedContractObject` (default-features
# off drops its nota-text codec). Gating all behind one feature keeps nota and
# the whole criome/router surface out of the binary-only daemon dependency tree
# unless an operator builds the mirror in. The name is retained for continuity;
# there is no longer a direct-to-mirror shipper — the router is the carrier.
mirror-shipper = ["dep:criome", "dep:signal-criome", "dep:signal-router"]

[[test]]
name = "instrumentation_logging"
path = "tests/instrumentation_logging.rs"
required-features = ["testing-trace"]

# The 1-of-1 LOCAL criome gate + router origination hand-off witness: the
# production daemon gate driven through a REAL local criome Unix socket, then
# the authorized head handed to a stub LOCAL router socket as an
# `ApplyAuthorizedRecord` frame (authorized head hands off; denied head does
# not). Proves the origination side of the router-mediated mirror.
[[test]]
name = "criome_gate_1of1"
path = "tests/criome_gate_1of1.rs"
required-features = ["mirror-shipper"]

# The rewired quorum origination boundary (primary-nbmq.10): Spirit's production
# `gate_and_hand_to_router` seam proposes a committed head under a REAL 2-of-2
# mirror quorum contract across two criome daemons, withholds while Gathering, and
# ships the head + the quorum-assembled Evidence to a stub LOCAL router only on the
# Authorized verdict. Gated behind `mirror-shipper` alongside the origination.
[[test]]
name = "mirror_quorum_origination"
path = "tests/mirror_quorum_origination.rs"
required-features = ["mirror-shipper"]

# The quorum-gated authorized-apply ingress witness (piece 4): an arriving
# content-addressed record lands LIVE on an Authorized verdict and is
# immediately observable; a non-Authorized verdict or a re-hash mismatch is
# refused fail-closed. Unit-testable against a locally-assembled Evidence — no
# live criome daemon.
[[test]]
name = "authorized_apply_ingress"
path = "tests/authorized_apply_ingress.rs"
required-features = ["mirror-shipper"]

[dependencies]
nota = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
blake3 = "1"
getrandom = "0.3"
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
# The previous engine generation, used only by the production-migration
# bootstrap: it reads pre-versioning stores the current engine refuses to open.
sema-engine-previous = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "ebee6e44ba6ee4afcb26998007bcfd128641b54c", package = "sema-engine", optional = true }
# The deployed v9/layout-3 engine generation, used only by the
# production-migration bootstrap to read materialized rows from the live
# 0.12.1 store whose old versioned log cannot be decoded by the layout-5
# engine.
sema-engine-layout3 = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "dbe29427d9a2c6c194909385485ad42b008048b8", package = "sema-engine", optional = true }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "drop-next" }
# The 1-of-1 LOCAL criome gate (Spirit `xhwa`), gated behind `mirror-shipper`.
# criome brings the `CriomeClient` synchronous Unix-socket transport spirit's
# gate wraps in `spawn_blocking`; signal-criome brings the typed
# `AuthorizedObjectReference` the gate projects from the post-commit head and
# the `EvaluateAuthorization` request/reply. Both pin `branch=main`, so Cargo
# unifies their shared transitive crates (triad-runtime, sema-engine,
# nota, signal-frame) with the mirror leg in one binary. default-features
# = false on signal-criome drops its nota-text codec, which the daemon gate
# (binary rkyv only) does not use.
criome = { git = "https://github.com/LiGoldragon/criome.git", branch = "drop-next", optional = true }
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "drop-next", default-features = false, optional = true }
# The `signal-router` ordinary contract, gated behind `mirror-shipper`. Spirit's
# origination hand-off encodes a `SubmitRoutedObjects` request carrying one
# `RoutedContractObject` (the `ApplyAuthorizedRecord` frame) and dials its LOCAL
# router's working socket. Only the contract crate is pulled in — NOT the router
# daemon crate — so the router's runtime never enters spirit's dependency tree.
# default-features = false drops its nota-text codec (the daemon is binary-only).
signal-router = { git = "https://github.com/LiGoldragon/signal-router.git", branch = "drop-next", default-features = false, optional = true }
signal-agent = { git = "https://github.com/LiGoldragon/signal-agent.git", branch = "drop-next", optional = true }
# The shared wire contract for the tracing -> introspect slice (report 716):
# spirit projects its own `TraceEvent` onto `signal_introspect::ComponentTraceEvent`
# and pushes that contract type over the testing-trace socket, so introspect
# decodes the exact archived noun without depending on spirit. default-features
# = false drops its nota-text codec from non-text builds; spirit's own nota-text
# feature re-enables it.
# The shared wire contract for the tracing -> introspect slice (report 716):
# spirit projects its own `TraceEvent` onto `signal_introspect::ComponentTraceEvent`
# and pushes that contract type over the testing-trace socket, so introspect
# decodes the exact archived noun without depending on spirit. Optional and
# pulled in ONLY by `testing-trace`: signal-introspect carries a non-optional
# nota dependency, so leaving it out of the default daemon build keeps
# nota out of the binary-only runtime tree (the daemon's no-NOTA invariant).
signal-introspect = { git = "https://github.com/LiGoldragon/signal-introspect.git", branch = "drop-next", default-features = false, optional = true }
# The `EngineIdentifier` newtype stamped onto each pushed `ComponentTraceEvent`.
# It is a public field type of the `signal-introspect` contract records but is
# not re-exported from that crate's root, so spirit pins the same `signal-persona`
# instance directly to construct it; Cargo unifies it with signal-introspect's.
# Optional and pulled in only by `testing-trace`, for the same no-NOTA reason.
signal-persona = { git = "https://github.com/LiGoldragon/signal-persona.git", branch = "drop-next", optional = true }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", branch = "drop-next" }
meta-signal-spirit = { git = "https://github.com/LiGoldragon/meta-signal-spirit.git", branch = "drop-next" }
thiserror = "2"
tokio = { version = "1.47", features = ["io-util", "net", "rt-multi-thread", "sync"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "drop-next" }

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", branch = "drop-next" }

[dev-dependencies]
agent = { git = "https://github.com/LiGoldragon/agent.git", branch = "drop-next", features = ["live-provider"] }
schema = { package = "schema", git = "https://github.com/LiGoldragon/schema.git", branch = "drop-next" }
# Typed `SemaOperation` labels for versioned-log shape witnesses.
signal-sema = { git = "https://github.com/LiGoldragon/signal-sema.git", branch = "drop-next" }
tempfile = "3"

[[test]]
name = "guardian_live_scenarios"
path = "tests/guardian_live_scenarios.rs"
required-features = ["agent-guardian"]

[[test]]
name = "guardian_journal_upgrade"
path = "tests/guardian_journal_upgrade.rs"
required-features = ["agent-guardian"]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
