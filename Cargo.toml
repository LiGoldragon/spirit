[package]
name         = "spirit"
version      = "0.13.1"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/spirit"
description  = "Runnable schema-derived Spirit pilot: NOTA CLI, rkyv socket, generated schema types."
publish      = false

[lib]
name = "spirit"
path = "src/lib.rs"

[[bin]]
name = "spirit"
path = "src/bin/spirit.rs"
required-features = ["nota-text"]

[[bin]]
name = "meta-spirit"
path = "src/bin/meta-spirit.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-daemon"
path = "src/bin/spirit-daemon.rs"

[[bin]]
name = "spirit-write-configuration"
path = "src/bin/spirit-write-configuration.rs"
required-features = ["nota-text"]

[[bin]]
name = "spirit-migrate-store"
path = "src/bin/spirit-migrate-store.rs"
required-features = ["production-migration"]

[[test]]
name = "nix_integration"
path = "tests/nix_integration.rs"
required-features = ["nota-text"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
required-features = ["nota-text"]

[features]
default = []
nota-text = ["dep:nota-next"]
agent-guardian = ["nota-text", "dep:signal-agent"]
production-migration = ["nota-text", "dep:sema-engine-previous"]
testing-trace = []
# The gated mirror shipper: ship the versioned log to a sema version-control
# mirror. OFF by default and deploy-gated. Pulls the `mirror` crate (and its
# signal-mirror/nota-next transitive surface), so it is excluded from the
# binary-only daemon dependency tree unless explicitly enabled.
mirror-shipper = ["dep:mirror"]

[[test]]
name = "instrumentation_logging"
path = "tests/instrumentation_logging.rs"
required-features = ["testing-trace"]

[[test]]
name = "mirror_shipper"
path = "tests/mirror_shipper.rs"
required-features = ["mirror-shipper"]

[dependencies]
nota-next = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
blake3 = "1"
getrandom = "0.3"
# The reusable component-side mirror shipper. Gated entirely on an
# owner-configured meta MirrorTarget: with no target, no shipper ever starts.
# Gated behind the `mirror-shipper` feature (OFF by default). mirror pulls
# signal-mirror/meta-signal-mirror/nota-next unconditionally, so leaving it out
# of the default build keeps nota-next out of the binary-only daemon dependency
# tree — the daemon's no-NOTA invariant (INTENT). default-features = false drops
# mirror's own nota-text codec, which the shipper does not use. The shipper only
# ships when this feature is built AND an owner configures a MirrorTarget.
mirror = { git = "https://github.com/LiGoldragon/mirror.git", branch = "arc-shipper", default-features = false, optional = true }
# Pinned to the record-key-sum HEAD by rev (not branch) so the source spec is
# byte-identical to mirror's, letting Cargo unify them into ONE sema-engine
# instance — the precondition for sharing one `Arc<sema_engine::Engine>` with
# the mirror shipper. The commit is the record-key-sum branch HEAD.
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "65a6126a3eeb9e1741878f8c39eb12864541c36e" }
# The previous engine generation, used only by the production-migration
# bootstrap: it reads pre-versioning stores the current engine refuses to open.
sema-engine-previous = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "ebee6e44ba6ee4afcb26998007bcfd128641b54c", package = "sema-engine", optional = true }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-agent = { git = "https://github.com/LiGoldragon/signal-agent.git", branch = "main", optional = true }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", branch = "main" }
thiserror = "2"
tokio = { version = "1.47", features = ["io-util", "net", "rt-multi-thread", "sync"] }
# tailnet-listener (the branch mirror's shipper uses) currently points at the
# same commit as main; pinning the same branch spec lets Cargo unify the
# triad-runtime instance with mirror's, so the kameo actor/runtime types match.
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "tailnet-listener" }

[build-dependencies]
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[dev-dependencies]
agent = { git = "https://github.com/LiGoldragon/agent.git", branch = "main", features = ["live-provider"] }
# The mirror working/meta contracts, for the in-process mirror fixture the
# gated-shipper test ships to and restores from. Same branches mirror pins, so
# Cargo unifies them with the `mirror` crate's own dependency instances.
meta-signal-mirror = { git = "https://github.com/LiGoldragon/meta-signal-mirror.git", branch = "main" }
signal-mirror = { git = "https://github.com/LiGoldragon/signal-mirror.git", branch = "main" }
schema-next = { git = "https://github.com/LiGoldragon/schema-next.git", branch = "main" }
# Typed `SemaOperation` labels for versioned-log shape witnesses.
signal-sema = { git = "https://github.com/LiGoldragon/signal-sema.git", branch = "main" }
tempfile = "3"

[[test]]
name = "guardian_live_scenarios"
path = "tests/guardian_live_scenarios.rs"
required-features = ["agent-guardian"]

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
